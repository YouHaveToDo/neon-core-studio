<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- Arcane Ledger icon sprite sheet. Use via <use href="assets/icons.svg#icon-sword" />.
       All icons: 24x24 viewBox, stroke-based, currentColor. -->

  <symbol id="icon-sword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14.5 3.5L20.5 9.5L11 19L7 20L8 16L17.5 6.5" />
    <path d="M4 20L7.5 16.5" />
    <path d="M13 5L19 11" />
  </symbol>

  <symbol id="icon-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3L19 6V11C19 15.5 16 19 12 21C8 19 5 15.5 5 11V6L12 3Z" />
  </symbol>

  <symbol id="icon-crown" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 18H20L21 8L16 12L12 6L8 12L3 8L4 18Z" />
  </symbol>

  <symbol id="icon-mana" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3C12 3 6 11 6 15.5C6 19 8.7 21 12 21C15.3 21 18 19 18 15.5C18 11 12 3 12 3Z" />
  </symbol>

  <symbol id="icon-skull" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3C7.5 3 5 6.2 5 10C5 12.5 6 14 7 15V18H9V16H10.5V18H13.5V16H15V18H17V15C18 14 19 12.5 19 10C19 6.2 16.5 3 12 3Z" />
    <circle cx="9" cy="10" r="1.3" fill="currentColor" stroke="none" />
    <circle cx="15" cy="10" r="1.3" fill="currentColor" stroke="none" />
  </symbol>

  <symbol id="icon-heart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 20C12 20 4 14.5 4 9C4 6.2 6.2 4 9 4C10.5 4 11.5 4.8 12 5.5C12.5 4.8 13.5 4 15 4C17.8 4 20 6.2 20 9C20 14.5 12 20 12 20Z" />
  </symbol>

  <!-- Enemy character silhouettes: 100x100 viewBox, flat fill (currentColor), evenodd cutouts for face/visor. -->

  <symbol id="icon-char-sentinel" viewBox="0 0 100 100" fill="currentColor" fill-rule="evenodd">
    <path d="M50 6 L64 16 L68 40 L56 48 L76 56 L88 96 L12 96 L24 56 L44 48 L32 40 L36 16 Z
             M42 24 L58 24 L58 32 L42 32 Z" />
  </symbol>

  <symbol id="icon-char-thief" viewBox="0 0 100 100" fill="currentColor" fill-rule="evenodd">
    <path d="M50 4 L70 28 L64 36 L82 96 L18 96 L36 36 L30 28 Z
             M50 32 L58 44 L50 56 L42 44 Z" />
  </symbol>

  <symbol id="icon-char-boss" viewBox="0 0 100 100" fill="currentColor" fill-rule="evenodd">
    <path d="M50 2 L58 14 L66 6 L70 22 L80 40 L92 96 L78 86 L64 96 L50 88 L36 96 L22 86 L8 96 L20 40 L30 22 L34 6 L42 14 Z
             M42 30 L58 30 L58 38 L42 38 Z" />
  </symbol>

  <!-- Generic opponent silhouettes (online PvP, spec-online-pvp.md §7.2, art-direction.md
       §8.5). Same frame+silhouette technique as the enemy portraits above (100x100
       viewBox, flat fill, currentColor) but reworked to read as "a person", not a
       monster: no visor/hood/crown features, no face cutout (a cutout there would
       read as a mask, which fits a monster archetype but not a generic human), just
       a plain head+shoulders bust. There is no avatar/identity system this milestone
       (spec §4.4), so these are NOT tied to any account — purely decorative, the
       same 3 options exist for every match. Client picks one pseudo-randomly per
       match (recommend seeding by match/room id so it stays stable for the duration
       of a match rather than changing on re-render) purely to avoid every single
       match looking visually identical; the 3 variants differ only in a cosmetic
       "hairstyle" silhouette so they read as members of the same generic-figure
       family, not as distinct characters. -->

  <symbol id="icon-char-opponent-a" viewBox="0 0 100 100" fill="currentColor">
    <path d="M34 30 A16 16 0 1 1 66 30 A16 16 0 1 1 34 30 Z
             M18 96 C18 66 32 48 50 48 C68 48 82 66 82 96 Z" />
  </symbol>

  <symbol id="icon-char-opponent-b" viewBox="0 0 100 100" fill="currentColor">
    <path d="M33 33 C33 20 40 11 50 11 C60 11 67 20 67 33 C67 42 60 47 50 47 C40 47 33 42 33 33 Z
             M16 96 C16 66 31 47 50 47 C69 47 84 66 84 96 Z" />
  </symbol>

  <symbol id="icon-char-opponent-c" viewBox="0 0 100 100" fill="currentColor">
    <path d="M35 28 A15 15 0 1 1 65 28 A15 15 0 1 1 35 28 Z
             M33 30 C25 40 23 56 28 70 L38 64 C34 52 35 38 40 29 Z
             M67 30 C75 40 77 56 72 70 L62 64 C66 52 65 38 60 29 Z
             M20 96 C20 70 33 52 50 52 C67 52 80 70 80 96 Z" />
  </symbol>

  <!-- Online-PvP additions (spec-online-pvp.md §9 art debt). New UI icons: 24x24
       viewBox, stroke-based, currentColor — same convention as the icon set above. -->

  <symbol id="icon-mail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="5" width="18" height="14" rx="2" />
    <path d="M4 6.5L12 13L20 6.5" />
  </symbol>

  <symbol id="icon-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="5" y="11" width="14" height="10" rx="2" />
    <path d="M8 11V7.5C8 5 9.8 3 12 3C14.2 3 16 5 16 7.5V11" />
  </symbol>

  <symbol id="icon-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="9" y="9" width="11" height="11" rx="1.5" />
    <path d="M6 15H5C4.4 15 4 14.6 4 14V5C4 4.4 4.4 4 5 4H14C14.6 4 15 4.4 15 5V6" />
  </symbol>

  <symbol id="icon-warning" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3L22 20H2L12 3Z" />
    <line x1="12" y1="9.5" x2="12" y2="14.5" />
    <circle cx="12" cy="17.3" r="0.9" fill="currentColor" stroke="none" />
  </symbol>

  <!-- Card back: 132x184 viewBox to match the card frame exactly (art-direction.md
       §3). Fixed palette colors (not currentColor) since a hidden card always reads
       the same regardless of context: geometric/emblematic, no illustration, same
       constraint as the rest of the set. Gold border distinguishes it at a glance
       from a card front (front border uses the faint line token, only the top
       type-bar is colored). -->
  <symbol id="card-back" viewBox="0 0 132 184">
    <defs>
      <linearGradient id="cardback-bg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#241a2c" />
        <stop offset="1" stop-color="#1e1624" />
      </linearGradient>
      <radialGradient id="cardback-glow" cx="50%" cy="50%" r="50%">
        <stop offset="0" stop-color="#3a2c46" />
        <stop offset="1" stop-color="#1e1624" stop-opacity="0" />
      </radialGradient>
    </defs>
    <rect x="0.75" y="0.75" width="130.5" height="182.5" rx="8" fill="url(#cardback-bg)" stroke="#d4af37" stroke-width="1.5" />
    <rect x="8" y="8" width="116" height="168" rx="4" fill="none" stroke="rgba(242,233,216,0.16)" stroke-width="1" />
    <circle cx="66" cy="92" r="36" fill="url(#cardback-glow)" />
    <g stroke="#d4af37" stroke-opacity="0.28" stroke-width="1">
      <line x1="66" y1="30" x2="66" y2="50" />
      <line x1="66" y1="134" x2="66" y2="154" />
      <line x1="20" y1="92" x2="40" y2="92" />
      <line x1="92" y1="92" x2="112" y2="92" />
      <line x1="34" y1="52" x2="47" y2="65" />
      <line x1="98" y1="52" x2="85" y2="65" />
      <line x1="34" y1="132" x2="47" y2="119" />
      <line x1="98" y1="132" x2="85" y2="119" />
    </g>
    <g stroke="#d4af37" stroke-width="1.4" fill="none">
      <rect x="16" y="20" width="9" height="9" transform="rotate(45 20.5 24.5)" />
      <rect x="107" y="20" width="9" height="9" transform="rotate(45 111.5 24.5)" />
      <rect x="16" y="155" width="9" height="9" transform="rotate(45 20.5 159.5)" />
      <rect x="107" y="155" width="9" height="9" transform="rotate(45 111.5 159.5)" />
    </g>
    <path transform="translate(44.4,70.4) scale(1.8)" fill="#d4af37" d="M12 3C12 3 6 11 6 15.5C6 19 8.7 21 12 21C15.3 21 18 19 18 15.5C18 11 12 3 12 3Z" />
  </symbol>
</svg>
